name: catalogue-diff

# Weekly: lists Cloudflare read permission groups that classification.yaml
# does not cover, and opens or updates one issue. Needs CLOUDFLARE_API_TOKEN
# (with Account API Tokens Read) and CLOUDFLARE_ACCOUNT_ID; skips without them.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diff:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      ISSUE_TITLE: "Cloudflare permission catalogue differs from classification.yaml"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the catalogue diff."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Diff the catalogue
        id: diff
        if: steps.creds.outputs.skip != 'true'
        run: |
          set +e
          python3 scripts/classification.py diff-catalogue --out report.md
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Open or update the issue
        if: steps.diff.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file report.md
          fi
